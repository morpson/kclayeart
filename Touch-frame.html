<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monochrome Ornate Painting Animation</title>
  <style>
    :root {
      --bg-dark: #09090b;
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.1);
      --frame-dark: #18181b;
      --frame-highlight: #52525b;
      --canvas-bg: #e4e4e7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* Stage Area */
    .animation-stage {
      position: relative;
      width: 320px;
      height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Glassmorphic Background Circle */
    .glass-circle {
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      box-shadow: 
        0 25px 50px rgba(0, 0, 0, 0.5),
        inset 0 1px 1px rgba(255, 255, 255, 0.2);
      z-index: 1;
      animation: ambientPulse 6s ease-in-out infinite alternate;
    }

    /* Ambient Light Behind Glass */
    .ambient-glow {
      position: absolute;
      width: 150px;
      height: 150px;
      background: rgba(255, 255, 255, 0.1);
      filter: blur(40px);
      border-radius: 50%;
      z-index: 0;
    }

    /* The Painting and Frame Container */
    .painting-wrapper {
      position: relative;
      width: 150px;
      height: 190px;
      transform-origin: 40% 70%;
      transform: rotate(-4deg);
      z-index: 2;
      animation: frameBounce 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .ornate-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.8));
    }

    /* Tap Ripple Effect */
    .interaction-ripple {
      position: absolute;
      top: 60%;
      left: 65%;
      width: 12px;
      height: 12px;
      border: 1.5px solid #ffffff;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      z-index: 4;
      animation: rippleExpand 3s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
    }

    /* Pointing Hand Cursor Container */
    .cursor-hand {
      position: absolute;
      top: 58%;
      left: 62%;
      width: 70px;
      height: 70px;
      z-index: 5;
      transform-origin: top left;
      animation: handTap 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .hand-symbol {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.7));
    }

    /* --- Animations --- */
    
    @keyframes handTap {
      0%, 100% {
        transform: translate(50px, 50px) rotate(15deg) scale(0.95);
        opacity: 0.7;
      }
      38% {
        transform: translate(0px, 0px) rotate(0deg) scale(1);
        opacity: 1;
      }
      44% {
        /* Downward press on the glass/painting */
        transform: translate(-2px, -2px) rotate(-3deg) scale(0.9);
      }
      56% {
        /* Release */
        transform: translate(0px, 0px) rotate(0deg) scale(1);
      }
      80% {
        transform: translate(50px, 50px) rotate(15deg) scale(0.95);
        opacity: 0.7;
      }
    }

    @keyframes frameBounce {
      0%, 38%, 75%, 100% {
        transform: rotate(-4deg) scale(1);
      }
      44% {
        /* Push back effect from the tap */
        transform: rotate(-2deg) scale(0.96);
      }
      52% {
        /* Rebound */
        transform: rotate(-5deg) scale(1.02);
      }
      62% {
        transform: rotate(-4deg) scale(1);
      }
    }

    @keyframes rippleExpand {
      0%, 42% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 0;
      }
      44% {
        opacity: 1;
      }
      65% {
        transform: translate(-50%, -50%) scale(5);
        opacity: 0;
      }
      100% {
        opacity: 0;
      }
    }

    @keyframes ambientPulse {
      0% {
        transform: scale(1);
      }
      100% {
        transform: scale(1.02);
      }
    }
  </style>
</head>

        <ellipse cx="82" cy="67" rx="7" ry="12" fill="#71717a" transform="rotate(160 82 67)"/>
        <!-- Flower 3 center -->

        <circle cx="82" cy="67" r="4" fill="#a1a1aa"/>
