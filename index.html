<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katherine Claye — Art</title>
  <meta name="description" content="Portfolio of Katherine Claye — original paintings and illustrations.">
  <meta property="og:title" content="Katherine Claye — Art">
  <meta property="og:description" content="Original paintings and illustrations by Katherine Claye.">
  <meta property="og:type" content="website">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ── Intro overlay ─────────────────────────────────────────── -->
  <div id="intro-overlay" class="intro-overlay" aria-hidden="true">
    <h1 class="intro-text">Katherine Claye</h1>
  </div>

  <!-- ── Touch-hint overlay (appears after intro, fades out after ~3s) ── -->
  <div id="touch-hint" class="touch-hint" aria-hidden="true">
    <div class="touch-hint__stage">
      <div class="touch-hint__ambient-glow"></div>
      <div class="touch-hint__glass-circle"></div>

      <!-- Ornate Frame & Painting -->
      <div class="touch-hint__painting-wrapper">
        <svg class="touch-hint__ornate-svg" viewBox="0 0 120 160" xmlns="http://www.w3.org/2000/svg">
          <rect x="0" y="0" width="120" height="160" fill="#27272a" stroke="#18181b" stroke-width="2"/>
          <rect x="6" y="6" width="108" height="148" fill="#3f3f46"/>
          <rect x="12" y="12" width="96" height="136" fill="none" stroke="#71717a" stroke-width="2"/>
          <path d="M 6 20 Q 20 20 20 6" fill="none" stroke="#a1a1aa" stroke-width="2"/>
          <path d="M 114 20 Q 100 20 100 6" fill="none" stroke="#a1a1aa" stroke-width="2"/>
          <path d="M 6 140 Q 20 140 20 154" fill="none" stroke="#a1a1aa" stroke-width="2"/>
          <path d="M 114 140 Q 100 140 100 154" fill="none" stroke="#a1a1aa" stroke-width="2"/>
          <circle cx="20" cy="20" r="3" fill="#52525b"/>
          <circle cx="100" cy="20" r="3" fill="#52525b"/>
          <circle cx="20" cy="140" r="3" fill="#52525b"/>
          <circle cx="100" cy="140" r="3" fill="#52525b"/>
          <rect x="18" y="18" width="84" height="124" fill="#09090b"/>
          <rect x="22" y="22" width="76" height="116" fill="#18181b"/>
          <rect x="22" y="22" width="76" height="116" fill="#18181b"/>
          <rect x="22" y="108" width="76" height="30" fill="#27272a"/>
          <line x1="38" y1="138" x2="38" y2="72" stroke="#52525b" stroke-width="3" stroke-linecap="round"/>
          <path d="M 38 100 Q 28 92 26 82" fill="none" stroke="#52525b" stroke-width="2"/>
          <ellipse cx="24" cy="80" rx="6" ry="4" fill="#3f3f46" transform="rotate(-30 24 80)"/>
          <ellipse cx="38" cy="62" rx="7" ry="12" fill="#71717a" transform="rotate(0 38 62)"/>
          <ellipse cx="38" cy="62" rx="7" ry="12" fill="#71717a" transform="rotate(45 38 62)"/>
          <ellipse cx="38" cy="62" rx="7" ry="12" fill="#71717a" transform="rotate(90 38 62)"/>
          <ellipse cx="38" cy="62" rx="7" ry="12" fill="#71717a" transform="rotate(135 38 62)"/>
          <circle cx="38" cy="62" r="8" fill="#e4e4e7" opacity="0.9"/>
          <circle cx="38" cy="62" r="4" fill="#a1a1aa"/>
          <line x1="60" y1="138" x2="60" y2="55" stroke="#52525b" stroke-width="3" stroke-linecap="round"/>
          <path d="M 60 95 Q 72 88 74 76" fill="none" stroke="#52525b" stroke-width="2"/>
          <ellipse cx="76" cy="74" rx="7" ry="4" fill="#3f3f46" transform="rotate(20 76 74)"/>
          <ellipse cx="60" cy="44" rx="8" ry="14" fill="#a1a1aa" transform="rotate(0 60 44)"/>
          <ellipse cx="60" cy="44" rx="8" ry="14" fill="#a1a1aa" transform="rotate(45 60 44)"/>
          <ellipse cx="60" cy="44" rx="8" ry="14" fill="#a1a1aa" transform="rotate(90 60 44)"/>
          <ellipse cx="60" cy="44" rx="8" ry="14" fill="#a1a1aa" transform="rotate(135 60 44)"/>
          <circle cx="60" cy="44" r="9" fill="#e4e4e7"/>
          <circle cx="60" cy="44" r="5" fill="#71717a"/>
          <line x1="82" y1="138" x2="82" y2="78" stroke="#52525b" stroke-width="3" stroke-linecap="round"/>
          <path d="M 82 105 Q 70 98 68 88" fill="none" stroke="#52525b" stroke-width="2"/>
          <ellipse cx="66" cy="86" rx="6" ry="4" fill="#3f3f46" transform="rotate(-20 66 86)"/>
          <ellipse cx="82" cy="67" rx="7" ry="12" fill="#71717a" transform="rotate(25 82 67)"/>
          <ellipse cx="82" cy="67" rx="7" ry="12" fill="#71717a" transform="rotate(70 82 67)"/>
          <ellipse cx="82" cy="67" rx="7" ry="12" fill="#71717a" transform="rotate(115 82 67)"/>
          <ellipse cx="82" cy="67" rx="7" ry="12" fill="#71717a" transform="rotate(160 82 67)"/>
          <circle cx="82" cy="67" r="8" fill="#e4e4e7" opacity="0.9"/>
          <circle cx="82" cy="67" r="4" fill="#a1a1aa"/>
        </svg>
      </div>

      <!-- Tap ripple ring -->
      <div class="touch-hint__ripple"></div>

      <!-- Pointing hand cursor -->
      <div class="touch-hint__cursor-hand">
        <svg viewBox="0 0 60 70" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <!-- Simplified pointing hand / finger icon -->
          <g fill="white" stroke="rgba(0,0,0,0.3)" stroke-width="1">
            <!-- Finger body -->
            <rect x="22" y="4" width="16" height="32" rx="8"/>
            <!-- Palm -->
            <rect x="10" y="24" width="40" height="28" rx="10"/>
            <!-- Extra fingers stacked -->
            <rect x="10" y="22" width="14" height="26" rx="7"/>
            <rect x="36" y="24" width="14" height="24" rx="7"/>
          </g>
        </svg>
      </div>
    </div>
  </div>

  <!-- ── Persistent header (fades in after intro) ──────────────── -->
  <header id="site-header" class="site-header">

    <!-- Left: artist name with CSS-animated nav -->
    <div class="artist-name-wrap" id="artist-name-wrap">
      <!-- Nav labels — cycle one at a time when idle, both on hover -->
      <nav class="artist-nav" aria-label="Site navigation">
        <a href="#contact" class="artist-nav__link artist-nav__contact" data-nav="contact">Contact</a>
        <a href="#about"   class="artist-nav__link artist-nav__about"   data-nav="about">About</a>
      </nav>
      <!-- The name itself -->
      <span class="artist-name" aria-label="Katherine Claye">Katherine Claye</span>
    </div>

    <!-- Right: layout controls + theme toggle -->
    <div class="header-controls">

      <nav class="sort-controls" aria-label="Gallery layout">
        <!-- Auto masonry: uneven columns suggesting adaptive layout -->
        <button class="sort-btn active" data-layout="auto" aria-pressed="true" title="Auto layout">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <rect x="1"  y="1" width="4" height="9"  rx="0.75" fill="currentColor"/>
            <rect x="6"  y="1" width="4" height="6"  rx="0.75" fill="currentColor"/>
            <rect x="11" y="1" width="4" height="11" rx="0.75" fill="currentColor"/>
          </svg>
        </button>
        <!-- 3 equal columns -->
        <button class="sort-btn" data-layout="3col" aria-pressed="false" title="3 columns">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <rect x="1"  y="1" width="4" height="14" rx="0.75" fill="currentColor"/>
            <rect x="6"  y="1" width="4" height="14" rx="0.75" fill="currentColor"/>
            <rect x="11" y="1" width="4" height="14" rx="0.75" fill="currentColor"/>
          </svg>
        </button>
        <!-- Single column -->
        <button class="sort-btn" data-layout="1col" aria-pressed="false" title="Single column">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <rect x="3" y="1" width="10" height="14" rx="0.75" fill="currentColor"/>
          </svg>
        </button>
      </nav>

      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle light / dark mode">
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
             viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1"  x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22"   x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1"  y1="12" x2="3"  y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
             viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>

    </div>
  </header>

  <!-- ── Gallery ───────────────────────────────────────────────── -->
  <main id="gallery" class="gallery" aria-label="Artwork gallery">
    <!-- Items injected by main.js -->
  </main>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
