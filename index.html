<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katherine Claye — Art</title>
  <meta name="description" content="Portfolio of Katherine Claye — original paintings and illustrations.">
  <meta property="og:title" content="Katherine Claye — Art">
  <meta property="og:description" content="Original paintings and illustrations by Katherine Claye.">
  <meta property="og:type" content="website">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ── Intro overlay ─────────────────────────────────────────── -->
  <div id="intro-overlay" class="intro-overlay" aria-hidden="true">
    <h1 class="intro-text">Katherine Claye</h1>
  </div>

  <!-- ── Persistent header (fades in after intro) ──────────────── -->
  <header id="site-header" class="site-header">

    <!-- Left: artist name → mailto -->
    <a class="artist-name"
       href="mailto:cgillis15@gmail.com"
       aria-label="Email Katherine Claye">
      Katherine Claye
    </a>

    <!-- Right: layout controls + theme toggle -->
    <div class="header-controls">

      <nav class="sort-controls" aria-label="Gallery layout">
        <!-- Auto masonry: uneven columns suggesting adaptive layout -->
        <button class="sort-btn active" data-layout="auto" aria-pressed="true" title="Auto layout">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <rect x="1"  y="1" width="4" height="9"  rx="0.75" fill="currentColor"/>
            <rect x="6"  y="1" width="4" height="6"  rx="0.75" fill="currentColor"/>
            <rect x="11" y="1" width="4" height="11" rx="0.75" fill="currentColor"/>
          </svg>
        </button>
        <!-- 3 equal columns -->
        <button class="sort-btn" data-layout="3col" aria-pressed="false" title="3 columns">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <rect x="1"  y="1" width="4" height="14" rx="0.75" fill="currentColor"/>
            <rect x="6"  y="1" width="4" height="14" rx="0.75" fill="currentColor"/>
            <rect x="11" y="1" width="4" height="14" rx="0.75" fill="currentColor"/>
          </svg>
        </button>
        <!-- Single column -->
        <button class="sort-btn" data-layout="1col" aria-pressed="false" title="Single column">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <rect x="3" y="1" width="10" height="14" rx="0.75" fill="currentColor"/>
          </svg>
        </button>
      </nav>

      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle light / dark mode">
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
             viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1"  x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22"   x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1"  y1="12" x2="3"  y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
             viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>

    </div>
  </header>

  <!-- ── Gallery ───────────────────────────────────────────────── -->
  <main id="gallery" class="gallery" aria-label="Artwork gallery">
    <!-- Items injected by main.js -->
  </main>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
