[build]
  publish = "."
  command = "node build.js"

# HTML pages — always revalidate so browsers pick up new asset hashes.
# Safari in particular caches aggressively, so no-cache + no-store is safest.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"

# JS and CSS — versioned by content hash in the query string,
# so long-lived caching is safe. Browsers will only request a
# new copy when the ?v=<hash> changes in index.html.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static assets (images, frames, videos, fonts, etc.) — cache aggressively.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# SPA direct routes for /about and /contact
[[redirects]]
  from = "/about"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/index.html"
  status = 200

# Block direct access to source-only directories
[[redirects]]
  from = "/Frames/*"
  to = "/404"
  status = 404

[[redirects]]
  from = "/kclaye_art/*"
  to = "/404"
  status = 404

[[redirects]]
  from = "/data/*"
  to = "/404"
  status = 404

[[redirects]]
  from = "/venv/*"
  to = "/404"
  status = 404

[[redirects]]
  from = "/*.py"
  to = "/404"
  status = 404

[[redirects]]
  from = "/grid.html"
  to = "/404"
  status = 404

[[redirects]]
  from = "/deploy_grid/*"
  to = "/404"
  status = 404
