<svg width="320" height="320" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
  <filter id="paper-texture-dark" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.5 0.65" numOctaves="4" stitchTiles="stitch" result="fiberA"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.65 0.5" numOctaves="4" stitchTiles="stitch" result="fiberB"/>
    <feBlend in="fiberA" in2="fiberB" mode="multiply" result="weave"/>
    <feDiffuseLighting in="weave" lighting-color="#ffffff" surfaceScale="1.4" result="light">
      <feDistantLight azimuth="60" elevation="55"/>
    </feDiffuseLighting>
    <feComponentTransfer in="light" result="contrast">
      <feFuncR type="linear" slope="0.9" intercept="0.05"/>
      <feFuncG type="linear" slope="0.9" intercept="0.05"/>
      <feFuncB type="linear" slope="0.9" intercept="0.05"/>
      <feFuncA type="linear" slope="0.035"/>
    </feComponentTransfer>
  </filter>
  <rect width="100%" height="100%" fill="#ffffff" opacity="0.035" filter="url(#paper-texture-dark)"/>
</svg>
